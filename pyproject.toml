[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tonshop"
version = "0.1.0"
description = "Minimalist Telegram ecommerce bot with TON payment verification"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.22,<4",
  "aiohttp>=3.10,<4",
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "cryptography>=43,<47",
  "tonsdk>=1.0.15,<2",
]

[project.scripts]
tonshop = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]
